<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoKey Decks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a101c;color:#e8f1ff;font:15px system-ui}header{padding:20px;background:#132139;border-bottom:1px solid #314561}h1{margin:0;color:#73baff}main{max-width:1300px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}section{background:#142237;border:1px solid #314561;border-radius:14px;padding:16px}input,select,button,textarea{background:#1d304a;color:white;border:1px solid #486281;border-radius:8px;padding:10px;font:inherit}button{background:#226fdd;cursor:pointer}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.card{background:#20324c;padding:10px;border-radius:10px}.card img{width:100%;aspect-ratio:0.72;object-fit:contain}.card button{width:100%}.small{font-size:12px;color:#aebfd8}.entry{padding:8px 0;border-bottom:1px solid #34445a;display:flex;justify-content:space-between;gap:8px}.entry button{padding:3px 8px}textarea{width:100%;height:210px}.warning{color:#ffd48d}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
<header><h1>⚡ PoKey Decks</h1><span class="small">Competitive deck builder — early development preview</span></header>
<main><div class="tools"><label>Import card catalog JSON <input id="import" type="file" accept=".json" multiple></label><button id="backup">Download backup</button><span id="status" class="small">Live TCGdex search available. Enter a card name to search.</span></div>
<div class="layout"><section><h2>Card Search <span id="count" class="small"></span></h2><div class="tools"><input id="search" placeholder="Name, attack, ability, effect"><select id="format"><option value="all">All cards</option><option value="standard">Verified Standard only</option></select><select id="type"><option value="">All types</option><option>Grass</option><option>Fire</option><option>Water</option><option>Lightning</option><option>Psychic</option><option>Fighting</option><option>Darkness</option><option>Metal</option><option>Dragon</option><option>Colorless</option></select></div><div id="cards" class="cards"></div><button id="more">Show more</button></section>
<section><h2>Deck <span id="total">0/60</span></h2><input id="deckname" value="My Deck" aria-label="Deck name"><div class="tools"><button id="save">Save</button><button id="load">Load</button><button id="clear">Clear</button></div><div id="deck"></div><h3>Checks</h3><div id="checks" class="small"></div><h3>Decklist text</h3><button id="export">Generate</button> <button id="copy">Copy</button><textarea id="output" aria-label="Decklist export"></textarea><p class="small">PTCGL-style output is preliminary; compatibility must be tested. RK9 and PoKey Scan are planned.</p></section></div></main>
<script>
const el=id=>document.getElementById(id),store='pokey-v1';let catalog=[],deck={},visible=60,remoteResults=[],searchTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(c){let set=typeof c.set==='object'&&c.set?c.set:{name:String(c.set||'')};return {...c,id:String(c.id||set.id+'-'+c.number),set,number:String(c.number||''),name:c.name||'Unknown',attacks:c.attacks||[],abilities:c.abilities||[],rules:c.rules||[],types:c.types||[],images:c.images||{},legalities:c.legalities||{},subtypes:c.subtypes||[]}}
function persist(){try{localStorage.setItem(store,JSON.stringify({catalog,deck,name:el('deckname').value}))}catch{el('status').textContent='Storage full: download a backup.'}}
function card(id){return catalog.find(c=>c.id===id)}function legal(c){return String(c.legalities.standard||'').toLowerCase()==='legal'}
function render(){let q=el('search').value.toLowerCase(),type=el('type').value,standard=el('format').value==='standard';let filtered=(el('search').value.trim().length>=2?remoteResults:catalog).filter(c=>(!standard||legal(c))&&(!type||c.types.includes(type))&&(!q||[c.name,...c.attacks.flatMap(a=>[a.name,a.text,a.damage]),...c.abilities.flatMap(a=>[a.name,a.text]),...c.rules].join(' ').toLowerCase().includes(q)));el('count').textContent=filtered.length+' results';el('cards').innerHTML=filtered.slice(0,visible).map(c=>'<article class="card">'+(c.images.small?'<img loading="lazy" alt="'+esc(c.name)+'" src="'+esc(c.images.small)+'">':'')+'<b>'+esc(c.name)+'</b><div class="small">'+esc(c.set.name||c.set.id)+' '+esc(c.number)+'</div><button data-add="'+esc(c.id)+'">Add</button></article>').join('');el('more').hidden=filtered.length<=visible;renderDeck()}
function renderDeck(){let entries=Object.entries(deck).filter(([id,n])=>n>0&&card(id));let total=entries.reduce((s,[,n])=>s+n,0);el('total').textContent=total+'/60';el('deck').innerHTML=entries.map(([id,n])=>{let c=card(id);return '<div class="entry"><span>'+n+' × '+esc(c.name)+' <span class="small">'+esc(c.set.ptcgoCode||c.set.id)+' '+esc(c.number)+'</span></span><span><button data-minus="'+esc(id)+'">−</button><button data-add="'+esc(id)+'">+</button></span></div>'}).join('');let warnings=[];if(total!==60)warnings.push('Deck must have 60 cards');let names={};for(let [id,n] of entries){let c=card(id);if(!(c.supertype==='Energy'&&c.subtypes.includes('Basic')))names[c.name]=(names[c.name]||0)+n;if(!legal(c))warnings.push(c.name+': Standard legality unverified')}for(let [name,n] of Object.entries(names))if(n>4)warnings.push(name+': over four copies');el('checks').innerHTML=warnings.length?warnings.map(s=>'<p class="warning">⚠ '+esc(s)+'</p>').join(''):'Basic checks passed; verify tournament-specific rules.'}
document.addEventListener('click',e=>{let a=e.target.closest('[data-add]'),m=e.target.closest('[data-minus]');if(a){let id=a.dataset.add;if(!card(id)){let candidate=remoteResults.find(c=>c.id===id);if(candidate)catalog.push(candidate)}deck[id]=(deck[id]||0)+1;persist();renderDeck();fetchDetail(id)}if(m){deck[m.dataset.minus]=Math.max(0,(deck[m.dataset.minus]||0)-1);persist();renderDeck()}});
async function fetchDetail(id){try{let res=await fetch('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(id));if(!res.ok)throw Error('Card detail unavailable');let d=await res.json(),c=normalize({...d,number:d.localId,supertype:d.category||'',set:{id:d.set?.id,name:d.set?.name,ptcgoCode:d.set?.tcgOnline},images:{small:d.image?d.image+'/low.webp':''},legalities:{}});let i=catalog.findIndex(x=>x.id===id);if(i>=0)catalog[i]=c;persist();renderDeck()}catch(err){el('status').textContent='Card details unavailable: '+err.message}}
async function liveSearch(){let q=el('search').value.trim();if(q.length<2){remoteResults=[];render();return}try{el('status').textContent='Searching English card database…';let url='https://api.tcgdex.net/v2/en/cards?name='+encodeURIComponent(q);let res=await fetch(url);if(!res.ok)throw Error('Search unavailable');let list=await res.json();if(el('search').value.trim()!==q)return;remoteResults=list.map(d=>normalize({...d,number:d.localId,images:{small:d.image?d.image+'/low.webp':''}}));el('status').textContent='Live TCGdex results; full card details load when added.';render()}catch(err){el('status').textContent='Live search failed: '+err.message}}
el('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(liveSearch,350)});for(let id of ['type','format'])el(id).addEventListener('input',()=>{visible=60;render()});el('more').onclick=()=>{visible+=60;render()};
el('import').onchange=async e=>{try{let map=new Map(catalog.map(c=>[c.id,c]));for(let file of e.target.files){let raw=JSON.parse(await file.text()),arr=Array.isArray(raw)?raw:raw.data||raw.cards;if(!Array.isArray(arr))throw Error('JSON must contain an array of cards');for(let c of arr){let normalized=normalize(c);map.set(normalized.id,normalized)}}catalog=[...map.values()];remoteResults=[];persist();render();el('status').textContent=catalog.length+' cards imported'}catch(err){el('status').textContent='Import failed: '+err.message}};
el('save').onclick=()=>{localStorage.setItem('pokey-saved',JSON.stringify({deck,name:el('deckname').value}));alert('Deck saved in this browser')};
el('load').onclick=()=>{let s=localStorage.getItem('pokey-saved');if(!s)return alert('No saved deck');let x=JSON.parse(s);deck=x.deck||{};el('deckname').value=x.name||'My Deck';persist();renderDeck()};
el('clear').onclick=()=>{if(confirm('Clear current deck?')){deck={};persist();renderDeck()}};
el('export').onclick=()=>{let entries=Object.entries(deck).filter(([id,n])=>n>0&&card(id));let groups=['Pokémon','Trainer','Energy'];let lines=[];for(let group of groups){let items=entries.filter(([id])=>card(id).supertype===group);if(!items.length)continue;lines.push(group+': '+items.reduce((s,[,n])=>s+n,0));for(let [id,n] of items){let c=card(id);lines.push(n+' '+c.name+' '+(c.set.ptcgoCode||c.set.id||'')+' '+c.number)}lines.push('')}el('output').value=lines.join('\n')};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('output').value);alert('Copied')}catch{el('output').select();alert('Select and copy the text manually')}};
el('backup').onclick=()=>{let blob=new Blob([JSON.stringify({cards:catalog,deck,name:el('deckname').value},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokey-backup.json';a.click();URL.revokeObjectURL(a.href)};
try{let s=JSON.parse(localStorage.getItem(store)||'{}');catalog=(s.catalog||[]).map(normalize);deck=s.deck||{};el('deckname').value=s.name||'My Deck'}catch{}render();
</script></html>
